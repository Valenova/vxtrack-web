<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VXTRACK - Live Location & Consent Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">VX</div>
      <div>
        <h1>VXTRACK</h1>
        <p>Live Location &amp; Consent Tracker</p>
      </div>
    </div>
    <span id="topStatus">Siap</span>
  </header>

  <main>
    <section class="card">
      <h2>1. Buat Tautan Berbagi Lokasi</h2>
      <div class="row">
        <input type="text" id="phoneInput" placeholder="Masukkan Nomor HP (cth: 0812...)" />
        <button type="button" id="createLinkBtn">Buat Tautan</button>
      </div>

      <p class="label">Kirim tautan persetujuan ini ke pemilik HP:</p>
      <div class="row">
        <input type="text" id="shareLink" readonly placeholder="Tautan akan muncul di sini..." />
      </div>

      <div class="row">
        <button type="button" id="copyBtn">Salin Tautan</button>
        <button type="button" id="waBtn">Kirim via WhatsApp</button>
      </div>
    </section>

    <section class="card">
      <div id="statusText" class="status-box">Target: - | Status: Menunggu Tautan</div>
      <div id="map"></div>
      <p class="note">*Garis biru pada peta menunjukkan riwayat pergerakan lokasi yang telah disetujui pemilik HP.</p>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/tracker.js"></script>
</body>
</html>
